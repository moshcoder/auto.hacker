# bin/install.sh settings for auto.hacker (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: they go in $STATE_DIR/app.env, written from the logicsrc vault
# profullstack/auto-hacker--prod (AUTOHACKER_KEY, RESEND_API_KEY, MAIL_FROM,
# CRAWLPROOF_SITE, COINPAY_*, AUTOHACKER_SELF_PROOF for the self-verify demo).
#
# DOMAINS is empty on purpose: auto.hacker is a Moshpit name, so there is no
# Let's Encrypt certificate. Its nginx vhost terminates the Moshpit-issued
# certificate (/etc/ssl/moshpit/auto.hacker.*) and proxies to PORT; the pit.world
# relay gives it real TLS at https://auto.hacker.pit.world via *.pit.world.
APP=auto-hacker
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8793
HEALTH_PATH=/health
DOMAINS=
ACCESS_LOG=off

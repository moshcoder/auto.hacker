# auto.hacker on dev2: the Moshpit origin vhost. The modern moshpit-gateway edge
# terminates [::]:443 and stream-proxies by SNI to 127.0.0.1:8444 (ssl) here; port
# 80 serves directly. Both proxy to the app (systemd unit auto-hacker, /opt/auto.hacker,
# 127.0.0.1:8793). Certificate is the Moshpit self-signed pair the registry pins
# (/etc/ssl/moshpit/auto.hacker.*); the pit.world relay gives real TLS at
# https://auto.hacker.pit.world via *.pit.world.
#
# Installed as /etc/nginx/sites-available/auto.hacker (symlinked into sites-enabled).
# No request log: scan and sign-in URLs carry tokens.

server {
    listen 80;
    listen [::]:80;
    server_name auto.hacker;
    access_log off;
    error_log  /var/log/nginx/auto.hacker.error.log crit;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 127.0.0.1:8444 ssl proxy_protocol;   # edge: [::]:443 belongs to the stream proxy
    http2 on;
    server_name auto.hacker;
    ssl_certificate     /etc/ssl/moshpit/auto.hacker.crt;
    ssl_certificate_key /etc/ssl/moshpit/auto.hacker.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_conf_command Groups X25519MLKEM768:X25519:P-256;
    ssl_session_tickets off;
    ssl_session_cache shared:MoshpitSSL:10m;
    access_log off;
    error_log  /var/log/nginx/auto.hacker.error.log crit;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
